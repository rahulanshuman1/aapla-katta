# Builds the Android app (APK) automatically on every push to main – the same push that deploys Vercel + Render.
# Download it from: GitHub → Actions → (latest run) → Artifacts, or GitHub → Releases.
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}          # also lets you press "Run workflow" manually

permissions:
  contents: write                # needed to attach the APK to a GitHub Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://aapla-katta.onrender.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21        # Capacitor 7 needs JDK 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Is Firebase (push notifications) configured?
        id: fb
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then echo "push=true" >> "$GITHUB_OUTPUT"; else echo "push=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build website
        env:
          VITE_PUSH_ENABLED: ${{ steps.fb.outputs.push }}
        run: npx vite build

      - name: Create Android project (first time only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Permissions, icons and splash screens
        run: |
          node scripts/patch-native.mjs
          npx capacitor-assets generate --android

      - name: Firebase config for push notifications (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "google-services.json added"
          else
            echo "No GOOGLE_SERVICES_JSON secret - building without push notifications"
          fi

      - name: Sync web build into Android
        run: npx cap sync android

      - name: Version number = build number
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build debug APK (installable on any phone)
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check for signing secrets
        id: signing
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build + sign release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: frontend/android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out app/build/outputs/apk/release/AaplaKatta-release.apk "$RUNNER_TEMP/aligned.apk"
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" "$AAB" "$KEY_ALIAS"
          cp "$AAB" app/build/outputs/bundle/release/AaplaKatta-release.aab

      - name: Collect files
        run: |
          mkdir -p ../dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ../dist-apk/AaplaKatta-debug.apk
          [ -f android/app/build/outputs/apk/release/AaplaKatta-release.apk ] && cp android/app/build/outputs/apk/release/AaplaKatta-release.apk ../dist-apk/ || true
          [ -f android/app/build/outputs/bundle/release/AaplaKatta-release.aab ] && cp android/app/build/outputs/bundle/release/AaplaKatta-release.aab ../dist-apk/ || true
          ls -la ../dist-apk

      - name: Upload (Actions artifact, kept 30 days)
        uses: actions/upload-artifact@v4
        with:
          name: AaplaKatta-android-${{ github.run_number }}
          path: dist-apk/*
          retention-days: 30

      - name: Publish as GitHub Release (permanent download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Android build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: dist-apk/*
