# Render Blueprint – "New +" → "Blueprint" and point it at this repo.
services:
  - type: web
    name: aapla-katta-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL        # your Vercel URL(s), comma separated, no trailing slash
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Aapla Katta Admin
      - key: ORDER_NOTIFY_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: MAIL_FROM_NAME
        value: Aapla Katta
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
